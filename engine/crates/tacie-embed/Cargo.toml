[package]
name = "tacie-embed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# Expands the downloaded fp16 weights to fp32 on first run (`pack.rs`).
half = "2"
ndarray = "0.17"
# Builds the speaker embedding's input, Kaldi fbank (`voice/fbank.rs`).
rustfft = "6"
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Runs the sync embedding on the Apple GPU (`gpu/`). MLX builds from source, so Xcode's Metal Toolchain is needed
# (`xcodebuild -downloadComponent MetalToolchain`). Kernel files land in `MLX_RS_METAL_PATH` of `.cargo/config.toml`.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = "=0.32.0"

[dev-dependencies]
tempfile = "3"
