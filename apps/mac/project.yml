name: Tacie
options:
  bundleIdPrefix: ai.tacie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Korean is the source language; English comes from Localizable.xcstrings (docs/28)
  developmentLanguage: ko
packages:
  # updates (docs/15): 2.10.0, not the 2.10.1 of two days before this was added
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # usage numbers (docs/16): 3.92.0 of 2026-10-10, not the 3.92.x patches of the last two weeks
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.92.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Tacie:
    type: application
    platform: macOS
    scheme: {}
    sources:
      # shared with the iPhone app (docs/27 7-12): meeting records, engine client, small helpers
      - path: ../shared/Sources/TacieShared
      - path: Tacie
        excludes:
          - "Resources/Brand/**"   # logo originals for the outside world, not bundled
    info:
      path: Tacie/Info.plist
      properties:
        CFBundleDisplayName: Tacie
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: "0.1.48"
        CFBundleVersion: "49"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: 회의 중 질문을 알아듣고 근거 파일을 찾기 위해 마이크를 써요.
        NSAppleEventsUsageDescription: 회의를 듣는 동안 재생 중인 Music·Spotify를 멈췄다가 회의가 끝나면 다시 틀어요.
        NSAudioCaptureUsageDescription: 원격 회의에서 상대가 하는 말을 받아쓰려고 회의 앱 소리를 들어요. 화면은 보지 않아요.
        NSCalendarsFullAccessUsageDescription: 회의를 시작할 때 지금 열리는 일정의 제목과 초대된 사람 이름을 채우려고 캘린더를 읽어요.
        # updates (docs/15): downloaded quietly, installed on a restart; checked at launch and once a day
        SUFeedURL: $(TACIE_SU_FEED_URL)
        SUPublicEDKey: $(TACIE_SU_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        # the release notes page's script shows every version this Mac skipped (UpdateNotes)
        SUEnableJavaScript: true
        SUScheduledCheckInterval: 86400
        # usage numbers (docs/16): the project token is public; a test run or an empty token sends nothing
        TaciePostHogToken: $(TACIE_POSTHOG_TOKEN)
        TaciePostHogHost: $(TACIE_POSTHOG_HOST)
        # open or official, and the official-only values (Build.xcconfig, Official.xcconfig; BuildValues reads them)
        TacieEdition: $(TACIE_EDITION)
        TacieGitHubClientID: $(TACIE_GITHUB_CLIENT_ID)
        TacieLinearClientID: $(TACIE_LINEAR_CLIENT_ID)
        TacieDropboxAppKey: $(TACIE_DROPBOX_APP_KEY)
        TacieAccountServer: $(TACIE_ACCOUNT_SERVER)
        TacieRelaySeoul: $(TACIE_RELAY_SEOUL)
        TacieRelayUS: $(TACIE_RELAY_US)
        TacieModelsBase: $(TACIE_MODELS_BASE)
    # The Rust engine is built by cargo and copied into Contents/MacOS (scripts/build-engine.sh). It runs on
    # every build (cargo skips an unchanged engine) and needs the sandbox off: it reads engine/ and writes its target/.
    dependencies:
      - package: Sparkle
      - package: PostHog
    postCompileScripts:
      - name: Build search engine
        script: '"$SRCROOT/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
      - name: Google Drive client
        script: '"$SRCROOT/scripts/gdrive-client.sh"'
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Build.xcconfig
      Release: Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TACIE_BUNDLE_ID)
        PRODUCT_NAME: Tacie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # every String(localized:), LocalizedStringKey and LocalizedStringResource lands in Localizable.xcstrings
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      # The shipped app carries no symbol table (names of our types and functions); the dSYM stays in
      # build.noindex, outside the app. The engine is stripped by cargo (engine/Cargo.toml).
      configs:
        # a development build is another app to macOS (its bundle id in Build.xcconfig / Official.xcconfig): its own
        # settings, keychain items, logs and meetings, so it never touches the installed app's connections (Build.names)
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: YES
  # Plain logic only (no app host): the app would start the engine and the island inside the test run.
  TacieTests:
    type: bundle.unit-test
    platform: macOS
    # the same edition as the app (Build.isOpen in the shared sources compiled here)
    configFiles:
      Debug: Build.xcconfig
      Release: Build.xcconfig
    # Sparkle and PostHog have to be resolvable here too, or the module scan of the test target fails (no test uses them)
    dependencies:
      - package: Sparkle
      - package: PostHog
    sources:
      - path: TacieTests
      - path: Tacie/Meetings
      - path: Tacie/MCP
      - path: Tacie/Theme/Theme.swift
      - path: Tacie/Panels/IslandSizing.swift
      - path: Tacie/Panels/IslandClearance.swift
      - path: Tacie/Panels/AskBlur.swift
      - path: Tacie/Panels/MainWindowShape.swift
      - path: Tacie/Views/Main/TitleRowPage.swift
      - path: Tacie/Views/Main/LimitNotesBlock.swift
      - path: Tacie/Views/PillTap.swift
      - path: Tacie/App/LaunchWindow.swift
      - path: Tacie/Views/BrandMark.swift
      - path: Tacie/Services/BrandImages.swift
      - path: ../shared/Sources/TacieShared
      - path: Tacie/Services/EngineClient+Connections.swift
      - path: Tacie/Services/UpdatePrompt.swift
      - path: Tacie/Services/EngineLaunch.swift
      - path: Tacie/Services/GitHubDevice.swift
      - path: Tacie/Services/DevSettings.swift
      - path: Tacie/Services/Listener.swift
      - path: Tacie/Services/UpdateNotes.swift
      - path: Tacie/Services/WhatsNew.swift
      - path: Tacie/Services/LogReport.swift
      - path: Tacie/Settings/SettingsText.swift
      - path: Tacie/Settings/SyncRules.swift
      - path: Tacie/Settings/GitHubCredentials.swift
      - path: Tacie/Settings/AIKeys.swift
      - path: Tacie/Settings/AIAddress.swift
      - path: Tacie/Settings/SttProvider.swift
      - path: Tacie/Settings/AIMode.swift
      - path: Tacie/Settings/AIChecks.swift
      - path: Tacie/Settings/PastedTokens.swift
      - path: Tacie/Settings/TokenConnectModel.swift
      - path: Tacie/Services/AnalyticsEvent+Mac.swift
      - path: Tacie/Services/FeedbackSurvey.swift
      - path: Tacie/Views/Main/FeedbackCard.swift
      - path: Tacie/Services/ConnectPrompt.swift
      - path: Tacie/Views/Main/ConnectPromptCard.swift
      - path: Tacie/Services/MeetingApps.swift
      - path: Tacie/Services/MediaPause.swift
      - path: Tacie/Views/RecordNoticeLine.swift
      - path: Tacie/Services/CalendarStore.swift
      - path: Tacie/Services/TokenStore.swift
      - path: Tacie/Settings/AccountSpace.swift
      - path: Tacie/Panel
      # the answer marks and failure words the panel shares with the island
      - path: Tacie/Views/Citations.swift
      - path: Tacie/Views/FailureWords.swift
      - path: Tacie/Services/NotionConnect.swift
      - path: Tacie/Services/LinearConnect.swift
      - path: Tacie/Services/GDriveConnect.swift
      - path: Tacie/Services/AtlassianConnect.swift
      - path: Tacie/Services/WebSignIn.swift
      - path: Tacie/Services/AsanaConnect.swift
      - path: Tacie/Services/DropboxConnect.swift
      - path: Tacie/Services/TacieAccount.swift
      - path: Tacie/Services/SpeakerModel.swift
      - path: Tacie/Settings/Account.swift
      - path: Tacie/Onboarding/OnboardingFlow.swift
      - path: Tacie/Onboarding/FirstSteps.swift
      - path: Tacie/Services/CallAudioTap.swift
      - path: Tacie/Services/SystemAudio.swift
      - path: Tacie/Services/ModelDownload.swift
      - path: Tacie/Services/LocalSTT.swift
      - path: Tacie/Services/LocalSTTCopy.swift
      - path: Tacie/Services/QuietMeeting.swift
      - path: Tacie/Services/NetHealth.swift
      # the views of the on-device speech recognition, so a test can render them (docs/22 section 4)
      - path: Tacie/Theme/TextScale.swift
      - path: Tacie/Views/Settings/SettingsParts.swift
      - path: Tacie/Views/Settings/SettingsSearch.swift
      - path: Tacie/Views/Settings/SettingsSceneParts.swift
      - path: Tacie/Views/Settings/MeetingSettingsScene.swift
      - path: Tacie/Views/Settings/STTPathScene.swift
      - path: Tacie/Views/Settings/AIPathScene.swift
      - path: Tacie/Views/Settings/AIChoiceCards.swift
      - path: Tacie/Views/Settings/ConnectionsScene.swift
      - path: Tacie/Views/Settings/LocalSTTRow.swift
      - path: Tacie/Views/Main/MainParts.swift
      - path: Tacie/Views/SourceMark.swift
      - path: Tacie/Views/Main/ModelRow.swift
      - path: Tacie/Views/DoneMark.swift
      - path: Tacie/Views/NetBars.swift
      - path: Tacie/Views/Main/FirstStepsCard.swift
      # the Jira · Confluence card, tile and picker, so a test can render every state (AtlassianCardRenderTests)
      - path: Tacie/Views/Settings/AtlassianCardParts.swift
      - path: Tacie/Views/Settings/TokenConnectParts.swift
      - path: Tacie/Views/Settings/LicensesPage.swift
      # the Asana card, tile, picker and disconnect confirmation, so a test can render every state (AsanaCardRenderTests)
      - path: Tacie/Views/Settings/AsanaCardParts.swift
      # the Dropbox card, tile and folder picker, so a test can render every state (DropboxCardRenderTests)
      - path: Tacie/Views/Settings/DropboxCardParts.swift
      # the Obsidian card and vault picker, and the vault list (NotesCardTests, docs/34)
      - path: Tacie/Views/Settings/NotesCardParts.swift
      # the MCP section's rows, so a test can render every state (MCPSectionRenderTests, docs/38 §5)
      - path: Tacie/Views/Settings/MCPSectionParts.swift
      - path: Tacie/Views/Settings/PickRow.swift
      - path: Tacie/Views/Settings/CalendarCardParts.swift
      - path: Tacie/Views/Main/MeetingEventLine.swift
      - path: Tacie/Views/Main/ResumeCapsule.swift
      - path: Tacie/Services/ObsidianVaults.swift
      - path: Tacie/Onboarding/TileParts.swift
      - path: Tacie/Views/Motion.swift
      - path: Tacie/Views/Wrap.swift
      # the meeting page's selection, so a test can drag over it
      - path: Tacie/Views/Main/SelectableText.swift
      - path: Tacie/Views/Main/RecordingViews.swift
      # the transcript and the naming views, so a test can render a name's ⌄ and the naming toast
      - path: Tacie/Views/Main/TranscriptText.swift
      - path: Tacie/Views/Main/LedgerEditing.swift
      - path: Tacie/Views/Main/SpeakerViews.swift
      # the list row, the title and what an iPhone meeting shows, so a test can render them (IPhoneMeetingPageTests)
      - path: Tacie/Views/Main/MeetingRow.swift
      - path: Tacie/Views/Main/EditableTitle.swift
      - path: Tacie/Views/Main/IPhoneMeetingUI.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets: [TacieTests]
